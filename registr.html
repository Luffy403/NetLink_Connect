<!doctype html>
<html lang="en">
  <head>
    <!-- Устанавливаем кодировку документа -->
    <meta charset="UTF-8" />
    <!-- Настройки для адаптивного дизайна -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- Стили -->
    <link rel="stylesheet" href="css/main.css" />
    <link rel="stylesheet" href="css/registr.css" />
    <!-- Заголовок страницы -->
    <title>Регистрация</title>
  </head>
  <body>
    <!--Шапка сайта-->
    <header class="header">
      <div class="container header__container">
        <nav class="navbar">
          <!-- Логотип -->
          <img src="img/Логотип.png" class="logo" alt="Логотип" />
          <!-- Кнопка-бургер (появляется на экранах <=1024px) -->
          <!-- Список со страницами -->
          <ul class="navbar__list" id="navbarList">
            <li><a class="navbar__item" href="index.html">Главная</a></li>
            <li><a class="navbar__item" href="tarifs.html">Тарифы</a></li>
            <li><a class="navbar__item" href="registr.html">Регистрация</a></li>
            <li>
              <a class="navbar__item" href="connection.html">Подключение</a>
            </li>
            <li><a class="navbar__item" href="contacts.html">Контакты</a></li>
            <li><a class="navbar__item" href="about_us.html">О компании</a></li>
          </ul>

          <!-- Контейнер с поиском -->
          <div class="search__container">
            <input
              class="search__container-input"
              type="text"
              name="search"
              placeholder="поиск"
            />
            <button class="search__container-btn">Найти</button>
          </div>
          <!-- Бургер -->
          <div class="burger-menu" id="burgerMenu">
            <span></span>
            <span></span>
            <span></span>
          </div>
        </nav>
      </div>
    </header>
    <!-- Основной контент на сайте -->
    <main class="main">
      <!-- 1 секция -->
      <section class="section registration">
        <div class="container registration__container">
          <h1 class="section__title">Регистрация</h1>
          <!-- Форма -->
          <form>
            <!-- Первый инпут -->
            <label for="input1">Почта</label>
            <input
              type="text"
              name="email"
              id="input1"
              autocomplete="on | off"
              placeholder="email"
              required
            />
            <!-- Второй инпут -->
            <label for="input2">Логин</label>
            <input
              type="text"
              name="login"
              id="input2"
              autocomplete="on"
              placeholder="login"
              required
            />
            <!-- Третий инпут -->
            <label for="input3">Пароль</label>
            <input
              type="text"
              name="password"
              id="input3"
              autocomplete="on"
              placeholder="password"
              required
            />
            <!-- Четвёртый инпут -->
            <label for="input4">Повторите пароль</label>
            <input
              type="text"
              name="repeat_pass"
              id="input4"
              autocomplete="on | off"
              placeholder="repeat password"
              required
            />
            <!-- Контейнер с чекбоксом -->
            <div class="chek">
              <input type="checkbox" id="check1" />
              <label for="check1">Я согласен на обработку данных</label>
            </div>
            <!-- Кнопка регистрации -->
            <input type="submit" value="Зарегистрироваться" />
          </form>
        </div>
      </section>
    </main>
    <!-- Подвал сайта -->
    <footer class="footer">
      <span class="footer__text"
        >© 2025 NetLink Connect. Все права защищены.</span
      >
    </footer>
    <script src="js/dropdown.js"></script>
  </body>
</html>
